[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["F", "E", "W", "B", "S110", "S112"]

ignore = [
    "E501",
    "B008",
    "UP",
]

[tool.ruff.lint.per-file-ignores]
# Tests intentionally insert the repository root before local imports for direct execution.
"tests/*" = ["F401", "F841", "E402"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".venv", "ECC", ".agents"]
